name: scrooty
x-app: &app
  build:
    context: .
    dockerfile: deploy/Dockerfile
    target: app
  image: scrooty-app:local
  env_file: .env
  restart: unless-stopped
  volumes:
    - app_storage:/var/www/html/storage
  networks: [private]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: assistent
      POSTGRES_USER: assistent
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes: [pg_data:/var/lib/postgresql/data]
    networks: [private]
    restart: unless-stopped
    healthcheck: {test: ['CMD-SHELL', 'pg_isready -U assistent'], interval: 10s, timeout: 5s, retries: 10}
    mem_limit: 512m
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    volumes: [redis_data:/data]
    networks: [private]
    restart: unless-stopped
    healthcheck: {test: ['CMD', 'redis-cli', 'ping'], interval: 10s, timeout: 5s, retries: 10}
    mem_limit: 192m
  app:
    <<: *app
    networks:
      private: {aliases: [scrooty-app]}
    mem_limit: 384m
  worker:
    <<: *app
    command: php artisan queue:work redis --queue=integrations,ai,notifications,default --sleep=2 --tries=5 --timeout=600 --max-time=3600
    mem_limit: 384m
  documents:
    <<: *app
    command: php artisan queue:work redis --queue=documents --sleep=3 --tries=3 --timeout=900 --max-time=3600
    mem_limit: 384m
  scheduler:
    <<: *app
    command: php artisan schedule:work
    mem_limit: 128m
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: web
    image: scrooty-web:local
    restart: unless-stopped
    depends_on: [app]
    networks:
      private: {}
      gateway: {aliases: [scrooty-web]}
    ports: ['127.0.0.1:18743:80']
    mem_limit: 64m
networks:
  private:
    ipam:
      config: [{subnet: 172.30.49.0/24}]
  gateway:
    external: true
    name: rinulik_default
volumes:
  pg_data: {}
  redis_data: {}
  app_storage: {}
