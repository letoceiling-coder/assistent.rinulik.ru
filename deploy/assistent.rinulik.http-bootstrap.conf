# assistent.rinulik.ru — AI Assistant SaaS Platform (HTTP bootstrap)
server {
    listen 80;
    server_name assistent.rinulik.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}