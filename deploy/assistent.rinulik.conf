# assistent.rinulik.ru — AI Assistant SaaS Platform

server {
    listen 80;
    server_name assistent.rinulik.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name assistent.rinulik.ru;

    ssl_certificate     /etc/letsencrypt/live/assistent.rinulik.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assistent.rinulik.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/assistent.rinulik.ru.access.log;
    error_log  /var/log/nginx/assistent.rinulik.ru.error.log;

    client_max_body_size 22m;

    resolver 127.0.0.11 valid=30s;
    set $assistent_backend http://assistent-web:80;

    location / {
        proxy_pass $assistent_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 130s;
    }
}